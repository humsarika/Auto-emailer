{% extends "base.html" %}

{% block title %}Send Mails | Auto Emailer{% endblock %}

{% block content %}
    <div class="main-container">
        <div>
            <h1>Send Your Bulk Emails to HRs</h1>
        </div>
        <!-- <div class="header">
            <p>make sure you are logged in</p>
        </div> -->

        <div class="form-top-container">
            <div class="details-top-container">
                <div class="personal-details-container">
                    <div>
                        <label for="user_fullname">Full Name:</label>
                    <input type="text" id="user_fullname" name="user_fullname" required />
                    </div>
                    <div>
                        <label for="email_subject"> Email Subject:</label>
                    <input type="text" id="email_subject" name="email_subject" required />
                    </div>

                    <div>
                        <label for="user_email">Google Email id:</label>
                    <input type="email" id="user_email" name="user_email" required />
                    </div>

                    <div>
                        <label for="user_password">Your Gmail (App Password Required):</label><a href="/#howitworks" >Need help?</a>
                        <input type="password" id="user_password" name="user_password" required>
                        
                    </div>

                    <div>
                        <label for="job_role">Job role </label>
                        <input type="text" id="job_role" name="job_role" required />
                    </div>
                </div>
                <div class="row-flex-container">
                    <label for="degree">Degree </label>
                    <input type="text" id="degree" name="degree" required />

                    <label for="major">Major </label>
                    <input type="text" id="major" name="major" required />
                </div>
            </div>
            <div class="form-container">
                <div class="row-flex-container">
                    <form id="uploadCsvForm" method="POST" enctype="multipart/form-data">
                        <label for="csv_file">Upload Email data File:</label><br />
                        <div class="file-input-container">
                            <input type="file" id="csv_file" name="csv_file" accept=".csv" class="file-input" />
                            <label for="csv_file" class="custom-file-label">Choose CSV file</label>
                        </div>
                        <input class="button" type="submit" value="Upload" />
                    </form>
                </div>
                <div class="row-flex-container">
                    <form id="uploadResumeForm" method="POST" enctype="multipart/form-data">
                        <label for="resume_file">Upload Resume/CV :</label><br />
                        <div class="file-input-container">
                            <input type="file" id="resume_file" name="resume_file" accept=".pdf" class="file-input" />
                            <label for="resume_file" class="custom-file-label">Choose PDF file</label>
                        </div>
                        <input class="button" type="submit" value="Upload" />
                    </form>
                </div>
            </div>
            <!-- Flash messages section -->
        <div id="flashMessages" class="flash-messages" style="display: none"></div>
        </div>

        <div class="submit-button-container">       
            <form id="sendEmailsForm" method="POST">
                <input class="submit-button" type="submit" value="Send Emails" />
            </form>
        </div>
    </div>

    <script>
        document
            .getElementById("uploadCsvForm")
            .addEventListener("submit", function (event) {
                event.preventDefault();
                var formData = new FormData(this);
                var xhr = new XMLHttpRequest();
                xhr.open("POST", "/upload_csv", true);
                xhr.onload = function () {
                    var response = JSON.parse(xhr.responseText);
                    var flashMessages = document.getElementById("flashMessages");
                    flashMessages.style.display = "block";
                    flashMessages.innerHTML = response.message;
                    if (response.status === "success") {
                        flashMessages.className = "flash-messages";
                    } else {
                        flashMessages.className = "error-message";
                    }
                };
                xhr.send(formData);
            });

        document
            .getElementById("uploadResumeForm")
            .addEventListener("submit", function (event) {
                event.preventDefault();
                var formData = new FormData(this);
                var xhr = new XMLHttpRequest();
                xhr.open("POST", "/upload_resume", true);
                xhr.onload = function () {
                    var response = JSON.parse(xhr.responseText);
                    var flashMessages = document.getElementById("flashMessages");
                    flashMessages.style.display = "block";
                    flashMessages.innerHTML = response.message;
                    if (response.status === "success") {
                        flashMessages.className = "flash-messages";
                    } else {
                        flashMessages.className = "error-message";
                    }
                };
                xhr.send(formData);
            });

        document
            .getElementById("sendEmailsForm")
            .addEventListener("submit", function (event) {
                event.preventDefault();
                var formData = new FormData();
                formData.append(
                    "user_fullname",
                    document.getElementById("user_fullname").value
                );
                formData.append(
                    "user_email",
                    document.getElementById("user_email").value
                );
                formData.append(
                    "user_password",
                    document.getElementById("user_password").value
                );
                formData.append(
                    "email_subject",
                    document.getElementById("email_subject").value
                );
                // formData.append(
                //     "csv_file",
                //     document.getElementById("csv_file").files[0]
                // );
                // formData.append(
                //     "resume_file",
                //     document.getElementById("resume_file").files[0]
                // );
                formData.append("degree", document.getElementById("degree").value);
                formData.append("major", document.getElementById("major").value);
                formData.append(
                    "job_role",
                    document.getElementById("job_role").value
                );

                var xhr = new XMLHttpRequest();
                xhr.open("POST", "/send_emails", true);
                xhr.onload = function () {
                    var response = JSON.parse(xhr.responseText);
                    var flashMessages = document.getElementById("flashMessages");
                    flashMessages.style.display = "block";
                    flashMessages.innerHTML = response.message;
                    if (response.status === "success") {
                        flashMessages.className = "flash-messages";
                    } else {
                        flashMessages.className = "error-message";
                    }
                };
                xhr.send(formData);
            });
        document.querySelectorAll(".file-input").forEach(function (input) {
            input.addEventListener("input", function () {
                var label = this.nextElementSibling;
                var fileName = this.files[0].name;
                var maxLength = 15; 
                if (fileName.length > maxLength) {
                    var truncatedFileName =
                        fileName.substring(0, maxLength - 3) + "...";
                    label.textContent = truncatedFileName;
                } else {
                    label.textContent = fileName;
                }
                this.value = fileName;
            });
        });

    </script>

 {% endblock %}
